apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-data
  labels:
    {{- include "streaming-rag.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.ollama.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  labels:
    {{- include "streaming-rag.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: ollama
      {{- include "streaming-rag.selectorLabels" . | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: ollama
        {{- include "streaming-rag.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: ollama
          image: {{ .Values.ollama.image }}
          ports:
            - name: http
              containerPort: 11434
          volumeMounts:
            - name: data
              mountPath: /root/.ollama
          readinessProbe:
            exec:
              command: ["ollama", "list"]
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["ollama", "list"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.ollama.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ollama-data
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  labels:
    {{- include "streaming-rag.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: ollama
    {{- include "streaming-rag.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 11434
      targetPort: http
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-init
  labels:
    {{- include "streaming-rag.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama-init
  annotations:
    # Re-run on upgrade so model changes take effect
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 30
  template:
    metadata:
      labels:
        app.kubernetes.io/component: ollama-init
        {{- include "streaming-rag.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: pull
          image: {{ .Values.ollama.image }}
          env:
            - name: OLLAMA_HOST
              value: http://ollama:11434
            - name: OLLAMA_MODEL
              value: {{ .Values.ollama.model | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "Waiting for Ollama at $OLLAMA_HOST ..."
              until ollama list >/dev/null 2>&1; do sleep 5; done
              echo "Pulling model $OLLAMA_MODEL ..."
              ollama pull "$OLLAMA_MODEL"
              echo "Model ready."
