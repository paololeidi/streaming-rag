apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    {{- include "streaming-rag.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: api
      {{- include "streaming-rag.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api
        {{- include "streaming-rag.selectorLabels" . | nindent 8 }}
    spec:
      initContainers:
        - name: wait-for-chroma
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              until nc -z chroma 8000; do echo waiting for chroma; sleep 3; done
        - name: wait-for-ollama-model
          image: curlimages/curl:8.5.0
          command:
            - /bin/sh
            - -c
            - |
              MODEL="{{ .Values.ollama.model }}"
              echo "Waiting for Ollama model $MODEL ..."
              until curl -sf http://ollama:11434/api/tags | grep -q "$MODEL"; do
                sleep 5
              done
              echo "Model available."
      containers:
        - name: api
          image: {{ include "streaming-rag.appImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - uvicorn
            - api.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: streaming-rag-config
          {{- if .Values.langsmith.enabled }}
          env:
            - name: LANGCHAIN_API_KEY
              valueFrom:
                secretKeyRef:
                  {{- if .Values.langsmith.existingSecret }}
                  name: {{ .Values.langsmith.existingSecret }}
                  key: {{ .Values.langsmith.existingSecretKey }}
                  {{- else }}
                  name: streaming-rag-secrets
                  key: LANGCHAIN_API_KEY
                  {{- end }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    {{- include "streaming-rag.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.serviceType }}
  selector:
    app.kubernetes.io/component: api
    {{- include "streaming-rag.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
      {{- if and (eq .Values.api.serviceType "NodePort") .Values.api.nodePort }}
      nodePort: {{ .Values.api.nodePort }}
      {{- end }}
