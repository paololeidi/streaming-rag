{{- if and .Values.langsmith.enabled (not .Values.langsmith.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: streaming-rag-secrets
  labels:
    {{- include "streaming-rag.labels" . | nindent 4 }}
type: Opaque
stringData:
  LANGCHAIN_API_KEY: {{ .Values.langsmith.apiKey | quote }}
{{- end }}
