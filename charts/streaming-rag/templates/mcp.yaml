apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp
  labels:
    {{- include "streaming-rag.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: mcp
      {{- include "streaming-rag.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: mcp
        {{- include "streaming-rag.selectorLabels" . | nindent 8 }}
    spec:
      initContainers:
        - name: wait-for-chroma
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              until nc -z chroma 8000; do echo waiting for chroma; sleep 3; done
      containers:
        - name: mcp
          image: {{ include "streaming-rag.appImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "src/mcp_server/server.py", "--sse"]
          ports:
            - name: http
              containerPort: {{ .Values.mcp.port }}
          envFrom:
            - configMapRef:
                name: streaming-rag-config
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp
  labels:
    {{- include "streaming-rag.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  type: {{ .Values.mcp.serviceType }}
  selector:
    app.kubernetes.io/component: mcp
    {{- include "streaming-rag.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.mcp.port }}
      targetPort: http
      {{- if and (eq .Values.mcp.serviceType "NodePort") .Values.mcp.nodePort }}
      nodePort: {{ .Values.mcp.nodePort }}
      {{- end }}
