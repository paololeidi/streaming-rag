apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
  labels:
    {{- include "streaming-rag.labels" . | nindent 4 }}
    app.kubernetes.io/component: consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: consumer
      {{- include "streaming-rag.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: consumer
        {{- include "streaming-rag.selectorLabels" . | nindent 8 }}
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              until nc -z kafka 29092; do echo waiting for kafka; sleep 3; done
              until nc -z chroma 8000; do echo waiting for chroma; sleep 3; done
      containers:
        - name: consumer
          image: {{ include "streaming-rag.appImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "src/consumer.py"]
          envFrom:
            - configMapRef:
                name: streaming-rag-config
          resources:
            {{- toYaml .Values.consumer.resources | nindent 12 }}
